[project]
name = "crescentmoon"
version = "0.1.0"
description = "Physically-feasible adversarial attacks on a vision victim model through a restricted Environment API"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "torch>=2.4",
    "torchvision>=0.19",
    "ultralytics>=8.3",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "jupyter>=1.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
