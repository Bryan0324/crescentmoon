# Single source of truth for every stage.  Notebooks and scripts both read it,
# so a number changed here changes the whole project consistently.

project: crescentmoon
seed: 0

assets:
  # Real photos used only to segment the object library below -- no
  # environment ever renders one of these photos as-is.
  source_dir: assets/source
  # scripts/prepare_assets.py cuts every confident instance out of the source
  # photos by its own segmentation mask (not a bounding box) and writes each
  # one here, indexed by assets/objects.json. Stage 1 attacks exactly one of
  # these; Stage 2/3 compose several -- target + obstacle(s) -- into one scene.
  objects_dir: assets/objects
  objects_index: assets/objects.json

victim:
  kind: yolo              # yolo | colorblob  (colorblob = offline toy detector)
  weights: yolov8n.pt
  conf_threshold: 0.05    # low, so the environment can see *gradual* decay
  imgsz: 320
  device: cpu
  target_class: person

# One reward definition, shared by all stages (prompt.md section 12).
reward:
  w_conf: 1.0
  w_move: 0.05
  w_invalid: 0.25
  success_threshold: 0.25
  success_bonus: 1.0

stage1:
  render_size: 512
  obs_size: 64
  target_object: person_0  # Stage 1 attacks a single object -- see assets/objects.json
  target_center: [256.0, 290.0]
  target_height: 250
  background_seed: 0
  # Patch side, as a fraction of the target's own narrower dimension -- never
  # the canvas. The attack cannot overtake the object's boundary: at
  # patch_max_frac = 1.0 the patch is exactly as wide as the target and no
  # wider, so it can never spill past the target's own edges.
  patch_min_frac: 0.35
  patch_max_frac: 0.9
  max_rotation_deg: 90.0
  max_steps: 1
  search_episodes: 300     # query budget per baseline method
  eval_episodes: 100

stage2:
  render_size: 384
  obs_size: 64
  max_steps: 40
  accel: 10.0
  max_speed: 26.0
  max_step: 18.0
  damping: 0.85
  target_object: person_0
  target_center: [192.0, 215.0]
  target_height: 190
  patch_frac: 0.8          # patch side, as a fraction of the target's own narrower dimension
  spawn_center: [70.0, 320.0]
  spawn_jitter: 35.0
  # The scene is composed of several real, background-removed objects, not
  # placeholder rectangles -- each obstacle is another object from the
  # library, placed like the target (its own center + display height).
  obstacles:               # used by the "obstacle" variant only
    - object: person_1
      center: [90.0, 310.0]
      height: 100.0
  # Fixed-length episodes: ending early on success would pay less than hovering
  # just above the success threshold, and the agent would learn to hover.
  terminate_on_success: false
  eval_episodes: 25
  ppo:
    total_timesteps: 10000
    n_steps: 256
    batch_size: 64
    learning_rate: 0.0003
    ent_coef: 0.01

stage3:
  render_size: 384
  obs_size: 64
  fov_deg: 55.0
  max_steps: 50
  accel: 0.22
  max_speed: 0.55
  max_step: 0.40
  damping: 0.85
  target_object: person_0
  target_center: [0.0, 0.0, 11.0]
  target_world_height: 3.4
  patch_world_frac: 0.8    # patch side, as a fraction of the target's own narrower dimension
  world_lo: [-5.0, -3.2, 3.0]
  world_hi: [5.0, 3.2, 13.5]
  spawn_center: [-3.2, -1.4, 6.0]
  spawn_jitter: 0.7
  # Same idea as Stage 2: each obstacle is a real object from the library,
  # placed at its own world-space center + display height.
  obstacles:               # used by the "obstacle" variant only
    - object: person_1
      center: [-1.5, -2.5, 7.0]
      height: 1.2
  terminate_on_success: false
  eval_episodes: 20
  ppo:
    total_timesteps: 10000
    n_steps: 256
    batch_size: 64
    learning_rate: 0.0003
    ent_coef: 0.01

output:
  results_dir: results
  figures_dir: results/figures
