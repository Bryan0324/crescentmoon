# Single source of truth for every stage.  Notebooks and scripts both read it,
# so a number changed here changes the whole project consistently.

project: crescentmoon
seed: 0

assets:
  # A real photo used only to segment the target cutout below -- no
  # environment renders this photo itself any more.
  source_photo: assets/scene_photo.jpg
  # A real, background-removed (alpha-matted) cutout of one object, produced
  # by scripts/prepare_assets.py via instance segmentation. Every stage uses
  # this same sprite as its "target" WorldObject.
  target_sprite: assets/target_sprite.png

victim:
  kind: yolo              # yolo | colorblob  (colorblob = offline toy detector)
  weights: yolov8n.pt
  conf_threshold: 0.05    # low, so the environment can see *gradual* decay
  imgsz: 320
  device: cpu
  target_class: person

# One reward definition, shared by all stages (prompt.md section 12).
reward:
  w_conf: 1.0
  w_move: 0.05
  w_invalid: 0.25
  success_threshold: 0.25
  success_bonus: 1.0

stage1:
  render_size: 512
  obs_size: 64
  target_center: [256.0, 290.0]
  target_height: 250
  background_seed: 0
  patch_min_frac: 0.12     # patch side as a fraction of the image side
  patch_max_frac: 0.45     # a big physical board is allowed -- but costs more
  max_rotation_deg: 90.0
  max_steps: 1
  search_episodes: 300     # query budget per baseline method
  eval_episodes: 100

stage2:
  render_size: 384
  obs_size: 64
  max_steps: 40
  accel: 10.0
  max_speed: 26.0
  max_step: 18.0
  damping: 0.85
  target_center: [192.0, 215.0]
  target_height: 190
  patch_size: 82
  spawn_center: [70.0, 320.0]
  spawn_jitter: 35.0
  obstacles:               # used by the "obstacle" variant only
    - [140.0, 235.0, 235.0, 345.0]
  # Fixed-length episodes: ending early on success would pay less than hovering
  # just above the success threshold, and the agent would learn to hover.
  terminate_on_success: false
  eval_episodes: 25
  ppo:
    total_timesteps: 10000
    n_steps: 256
    batch_size: 64
    learning_rate: 0.0003
    ent_coef: 0.01

stage3:
  render_size: 384
  obs_size: 64
  fov_deg: 55.0
  max_steps: 50
  accel: 0.22
  max_speed: 0.55
  max_step: 0.40
  damping: 0.85
  target_center: [0.0, 0.0, 11.0]
  target_world_height: 3.4
  patch_world_size: 1.9
  world_lo: [-5.0, -3.2, 3.0]
  world_hi: [5.0, 3.2, 13.5]
  spawn_center: [-3.2, -1.4, 6.0]
  spawn_jitter: 0.7
  obstacles:               # (center_xyz, half_extents_xyz), "obstacle" variant only
    - [[-1.3, -0.6, 7.5], [0.9, 1.6, 0.4]]
  terminate_on_success: false
  eval_episodes: 20
  ppo:
    total_timesteps: 10000
    n_steps: 256
    batch_size: 64
    learning_rate: 0.0003
    ent_coef: 0.01

output:
  results_dir: results
  figures_dir: results/figures
